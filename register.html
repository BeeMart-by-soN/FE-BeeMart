<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeMart - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth">
        <form class="auth-form" onsubmit="handleRegister(event)">
            <h2 class="auth-title">Register Akun</h2>

            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="Username" placeholder="Username" required>
            </div>

            <div class="field">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="FullName" placeholder="Full Name" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="Password" placeholder="Password" required>
            </div>

            <div class="field">
                <label for="rePassword">Re-Password</label>
                <input type="password" id="rePassword" name="RePassword" placeholder="Re-Password" required>
            </div>

            <div class="field">
                <label for="role">Role</label>
                <select id="role" name="Role" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="Cashier">Kasir</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn-primary">Daftar</button>
            <p class="auth-link">Sudah punya akun? <a href="index.html">Login</a></p>
        </form>
    </div>

    <script src="common.js"></script>
    <script src="script.js"></script>
</body>
</html>
